services:
  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: optigate-proxy
    restart: unless-stopped
    # network_mode: host (added 2026-08-30, correcting the bridge-network
    # setup this service originally shipped with): phase3/nftables-manager
    # redirects intercepted LAN traffic to Squid's intercept ports via
    # nftables running natively on THIS box's own host network namespace
    # (not yet in this compose file -- see RoadMap.md's Milestone
    # list) -- SO_ORIGINAL_DST recovery only works when the socket that
    # calls it lives in the SAME namespace as the redirect that fired, and
    # a bridge-networked container is a DIFFERENT namespace from the
    # host's. Confirmed live 2026-08-30 while preparing this stack's first
    # real intercept-mode verification pass: bridge networking silently
    # broke destination recovery (Squid saw its own container address
    # instead of the real destination); switching to host networking
    # fixed it immediately, and is also just correct for how this
    # single-box deployment actually looks in production (nftables and
    # Squid on the same box, not split across container network
    # namespaces the way Docker defaults to). See RoadMap.md's live-
    # verification section for the full writeup.
    #
    # Squid's intercept-mode ports (both http_port and https_port below,
    # see proxy/squid.conf.template) also bind with the IP_TRANSPARENT
    # socket option and recover the pre-NAT destination via
    # SO_ORIGINAL_DST -- both require CAP_NET_ADMIN regardless of network
    # mode. Without this, Squid fails during comm_open_listener and exits
    # silently (exit code 1, no stdout/stderr at the default log level).
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      - LOCAL_NETWORK=${LOCAL_NETWORK:-192.168.1.0/24}
      - DASHBOARD_URL=${DASHBOARD_URL:-}
    volumes:
      - optigate_config:/config

  adguard:
    build:
      context: .
      dockerfile: adguard/Dockerfile
    container_name: optigate-adguard
    restart: unless-stopped
    # Same reasoning as proxy's network_mode: host above -- AdGuard Home
    # is the DNS-tier target of phase3/nftables-manager's
    # `redirect to :5353` rule (see baselineRules), which fires in the
    # host's own network namespace; AdGuard has to share that namespace
    # to receive that traffic at all, and to see devices' real LAN
    # source IPs rather than a Docker-bridge address -- its own
    # per-client hard-deny rules (controller/adguard_sync.py) are keyed
    # on exactly those real IPs.
    network_mode: host
    environment:
      # FIRST-BOOT BOOTSTRAP ONLY. Consumed once by adguard/entrypoint.sh
      # when the conf volume is empty. Leave ADGUARD_PASSWORD blank in
      # .env (the secure default): the entrypoint then generates a random
      # one, printed to this container's own logs
      # (`docker compose logs adguard`). After first boot the live
      # credential is owned by the dashboard -- set it on the Settings
      # page, which stores it in the `adguard_password` DB setting AND
      # re-hashes it into AdGuardHome.yaml (dashboard/adguard_config_sync.py).
      # The controller reads that same DB setting; nothing here needs the
      # password again. `docker compose restart adguard` after a change so
      # AdGuard reloads its yaml.
      - ADGUARD_USERNAME=${ADGUARD_USERNAME:-admin}
      - ADGUARD_PASSWORD=${ADGUARD_PASSWORD:-}
      # 5354, not 5353: avahi-daemon (mDNS), a common default service on
      # many Linux distributions, already binds 5353 -- a real deployment
      # found this the hard way (2026-09-08). Genuinely overridable, not
      # just a different hardcoded number, since some other box may have
      # its own unrelated thing sitting on 5354 too -- if so, override it
      # here AND keep nftables-manager's own -dns-redirect-port below in
      # sync (the interception profile has no way to discover this value
      # automatically; the two must agree by hand).
      - ADGUARD_DNS_PORT=${ADGUARD_DNS_PORT:-5354}
      # First-run only: subscribes to a curated set of uBlockOrigin/uAssets
      # domain-blocking lists (badware/privacy/resource-abuse/unbreak/
      # filters), layered on top of AdGuard's own default filter (already
      # enabled automatically). Set to 1 to skip this and keep only
      # AdGuard's own default filter -- see adguard/entrypoint.sh's own
      # comment for exactly which lists and why.
      - ADGUARD_SKIP_EXTRA_BLOCKLISTS=${ADGUARD_SKIP_EXTRA_BLOCKLISTS:-}
      # First-run only: how often AdGuard itself re-checks every subscribed
      # filter list, in hours -- 168 = once a week. The dashboard's "Check
      # for filter updates now" button works independently of this and
      # doesn't wait for it.
      - ADGUARD_FILTERS_UPDATE_INTERVAL_HOURS=${ADGUARD_FILTERS_UPDATE_INTERVAL_HOURS:-168}
      # 127.0.0.1 = AdGuard Home's OWN admin UI (separate from this
      # project's dashboard) only reachable from this machine. 0.0.0.0 =
      # reachable from any device on the LAN -- see adguard/entrypoint.sh's
      # own comment on why 127.0.0.1 is the default here.
      - ADGUARD_WEB_BIND=${ADGUARD_WEB_BIND:-127.0.0.1}
    volumes:
      - optigate_adguard_conf:/opt/adguardhome/conf
      - optigate_adguard_work:/opt/adguardhome/work

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: optigate-dashboard
    restart: unless-stopped
    # network_mode: host (added 2026-08-30, same day as the AdGuard
    # "check now" button below): AdGuard's own admin UI defaults to
    # 127.0.0.1-only (ADGUARD_WEB_BIND, a deliberate secure default --
    # see adguard's own comment above) -- a loopback-bound socket only
    # accepts connections from within the SAME network namespace, so a
    # bridge-networked dashboard container could never reach it at all
    # (not even via host.docker.internal/extra_hosts -- that reaches the
    # host through a bridge-facing address, a different source than
    # 127.0.0.1 as far as a strict loopback bind is concerned). Sharing
    # the host namespace, like proxy/adguard already do, is what
    # actually fixes this. DASHBOARD_HOST below takes over what the old
    # port-mapping's bind address used to control, for the same reason
    # ADGUARD_WEB_BIND does for adguard -- there's no more docker-level
    # port-publish remapping once host-networked, so the app's own
    # listen address is what gates LAN exposure now.
    network_mode: host
    # CAP_NET_BIND_SERVICE: block_page_server.py (added 2026-08-30, only
    # actually started when DASHBOARD_URL is set) binds port 80 for the
    # AdGuard-side friendly block page -- the dashboard runs as a
    # non-root user (see dashboard/Dockerfile's own `USER proxy`), which
    # can't bind a privileged port without this. Much narrower than
    # NET_ADMIN/NET_RAW granted elsewhere in this file -- this
    # capability ONLY allows binding low-numbered ports, nothing else.
    cap_add:
      - NET_BIND_SERVICE
    # Start after the proxy: its entrypoint fixes /config ownership on the
    # shared volume (and generates the CA cert) before the dashboard, which
    # runs as the same `proxy` user, opens the database.
    depends_on:
      - proxy
    environment:
      # Optional: only consumed on first run to seed the admin login. If unset,
      # the dashboard generates a random password and prints it to its logs.
      - DASHBOARD_USER=${DASHBOARD_USER:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      # 127.0.0.1 = this machine only (use SSH port-forwarding for remote
      # access); 0.0.0.0 = reachable from any device on the LAN.
      - DASHBOARD_HOST=${DASHBOARD_BIND:-127.0.0.1}
      - LOCAL_NETWORK=${LOCAL_NETWORK:-192.168.1.0/24}
      - OG_DB_PATH=/config/optigate.db
      - OG_CA_CERT_PATH=/config/ssl_cert/ca_cert.pem
      # If set, also starts block_page_server.py on port 80 (see above)
      # and tells controller/adguard_sync.py (via the controller
      # service's own --dashboard-url below) to point hard-denied
      # domains' DNS answers here via AdGuard's $dnsrewrite modifier,
      # instead of the bare default deny. Same variable Squid's own
      # deny_info already uses -- one setting for both paths.
      - DASHBOARD_URL=${DASHBOARD_URL:-}
      # AdGuard connection settings for the Settings page's "Check for
      # filter updates now" button (common/adguard_client.py). ADGUARD_URL
      # is the live value. ADGUARD_USERNAME/ADGUARD_PASSWORD are consumed
      # ONCE, to seed the same-named DB settings on first run only (via
      # set_setting_if_absent) -- leave ADGUARD_PASSWORD blank in .env and
      # set the real credential from the Settings page, which becomes the
      # single source of truth for both this service and the controller
      # (it also re-hashes it into AdGuardHome.yaml). See adguard's own
      # environment block above.
      - ADGUARD_URL=${ADGUARD_URL:-http://127.0.0.1:3000}
      - ADGUARD_USERNAME=${ADGUARD_USERNAME:-admin}
      - ADGUARD_PASSWORD=${ADGUARD_PASSWORD:-}
      # Phase 8: default time zone new Schedules are created with -- only
      # consumed once, to seed this DB setting on first run; editable from
      # the Settings page afterward. Each schedule keeps its own time zone
      # once created, so changing this later never moves an existing one.
      - HOUSEHOLD_TIME_ZONE=${HOUSEHOLD_TIME_ZONE:-UTC}
    volumes:
      - optigate_config:/config
      # Same volume adguard's own service mounts above, read-write here
      # too (added 2026-09-07, RoadMap.md's dated entry) -- lets
      # dashboard/adguard_config_sync.py write AdGuard's real
      # AdGuardHome.yaml directly whenever the admin changes their
      # dashboard password (update_admin()), since AdGuard Home's REST
      # API has no password-change endpoint at all (confirmed live
      # against a real instance). The two containers never write this
      # file at the same moment in practice (this only fires on an
      # infrequent, admin-triggered action, not a background loop), so
      # no file-locking beyond a plain read-modify-write.
      - optigate_adguard_conf:/opt/adguardhome/conf

  # ==========================================================
  # Phase 3 interception layer (arp-worker, nftables-manager, controller)
  # -- containerized 2026-08-30, gated behind the "interception" compose
  # profile so a plain `docker compose up` (no --profile flag) behaves
  # exactly as before: proxy + adguard + dashboard only, nothing here
  # starts, nothing touches a real network interface. Bringing this
  # profile up for real (`docker compose --profile interception up -d`)
  # is the actual "start intercepting this LAN" decision -- deliberately
  # left as an explicit, separate step an operator has to choose to take
  # (see RoadMap.md's fail-open/testing-discipline sections on why this
  # project treats that as a decision that needs a human, not something
  # a default `docker compose up` should ever do by itself), and it
  # requires real values for ARP_WORKER_IFACE/GATEWAY_IP/GATEWAY_MAC
  # below -- none of which have a sensible default.
  #
  # Verified 2026-08-30 via the same safe Docker-bridge test pattern
  # used throughout this project's development (a disposable
  # gateway/victim/worker triad, never the real production box or a
  # real household LAN) -- see RoadMap.md's live-verification section.

  arp-worker:
    build:
      context: phase3/arp-worker
    container_name: optigate-arp-worker
    restart: unless-stopped
    profiles: ["interception"]
    # network_mode: host -- needs to see the REAL LAN-facing interface
    # (ARP_WORKER_IFACE) to send/receive real ARP packets; a bridge-
    # networked container only ever sees a virtual veth, never the
    # host's actual interface.
    network_mode: host
    cap_add:
      - NET_RAW
    volumes:
      - optigate_run:/run/optigate
    command:
      - -iface=${ARP_WORKER_IFACE:-}
      - -socket=/run/optigate/arp-worker.sock
      - -controller-uid=${CONTROLLER_UID:-0}
    # No default for ARP_WORKER_IFACE on purpose -- pp-arp-worker's own
    # main.go refuses to start with -iface="" ("-iface and
    # -controller-uid are both required"), so an unconfigured attempt
    # to enable this profile fails loudly and immediately rather than
    # silently doing nothing or guessing an interface.

  nftables-manager:
    build:
      context: phase3/nftables-manager
    container_name: optigate-nftables-manager
    restart: unless-stopped
    profiles: ["interception"]
    # Same reasoning as proxy/adguard's own network_mode: host --
    # manages the SAME "optigate" nftables table those services'
    # redirect rules depend on, which only makes sense in the host's own
    # network namespace.
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - optigate_config:/config
    command:
      - -db-path=/config/optigate.db
      - -poll-interval=${NFTABLES_POLL_INTERVAL:-5s}
      # Must match adguard's own ADGUARD_DNS_PORT above -- see that
      # variable's own comment.
      - -dns-redirect-port=${ADGUARD_DNS_PORT:-5354}
      # RoadMap.md items 7/18/20 (2026-09-09): reuses the SAME
      # DASHBOARD_URL the controller service below already requires,
      # purely to learn the box's own LAN IP (nft.SelfIPFromDashboardURL)
      # so bump_v4's Squid redirect can exclude traffic addressed to the
      # box itself -- deliberately not a second, separately-configured
      # setting that could drift from it.
      - -dashboard-url=${DASHBOARD_URL:-}

  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    container_name: optigate-controller
    restart: unless-stopped
    profiles: ["interception"]
    # network_mode: host -- same reason dashboard needed it (added the
    # same day): this process calls AdGuard's admin API
    # (controller/adguard_sync.py) at ADGUARD_URL, which is
    # loopback-bound under host networking (see adguard's own
    # ADGUARD_WEB_BIND comment) and unreachable from a bridge-networked
    # container. It also needs phase3/nftables-manager's own
    # `optigate` table to exist already, though it never touches
    # nftables directly itself -- only through the shared DB.
    network_mode: host
    # depends_on only waits for these containers to *start*, not to be
    # actually ready (arp-worker's socket file, AdGuard's API) -- same
    # caveat docs/deployment/setup.md already notes for proxy/dashboard.
    # controller/main.py's own WorkerClient.connect() has no retry on
    # its *initial* connection attempt, so a too-early start here just
    # means one restart cycle (restart: unless-stopped) before it
    # settles, not a permanent failure.
    depends_on:
      - proxy
      - adguard
      - arp-worker
    volumes:
      - optigate_config:/config
      - optigate_run:/run/optigate
    command:
      - --socket=/run/optigate/arp-worker.sock
      - --db-path=/config/optigate.db
      - --gateway-ip=${GATEWAY_IP:-}
      - --gateway-mac=${GATEWAY_MAC:-}
      - --adguard-url=${ADGUARD_URL:-http://127.0.0.1:3000}
      # No --adguard-username/--adguard-password here on purpose: the
      # controller reads them from the `adguard_username`/`adguard_password`
      # DB settings (shared optigate_config volume, --db-path above), which
      # the dashboard owns as the single source of truth. Keeps the secret
      # off this command line entirely (it was showing up in `docker
      # inspect` / `ps`). The two flags still exist in main.py as optional
      # overrides for tests and manual runs. If the password isn't set yet,
      # the controller logs a warning and skips the AdGuard sync loops
      # rather than spraying 401s (which trips AdGuard's brute-force lock).
      - --dashboard-url=${DASHBOARD_URL:-}
    # No default for GATEWAY_IP/GATEWAY_MAC on purpose -- main.py's own
    # argparse refuses to start without both ("--db-path requires
    # --gateway-ip and --gateway-mac"), same fail-loudly reasoning as
    # ARP_WORKER_IFACE above.

volumes:
  optigate_config:
  optigate_adguard_conf:
  optigate_adguard_work:
  # Shared between arp-worker and controller ONLY -- just the Unix
  # socket file the two speak IPC over (network_mode: host shares the
  # network namespace, not the filesystem, so this still needs an
  # explicit shared volume even though both containers are host-networked).
  optigate_run:
